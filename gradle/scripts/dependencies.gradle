
repositories {
    // 阿里云镜像优先（public 代理 Maven Central，google 代理 Google Maven），加速依赖解析
    maven { url 'https://maven.aliyun.com/repository/public' }
    maven { url 'https://maven.aliyun.com/repository/google' }
    maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }

    maven {
        name = 'CleanroomMC'
        url = 'https://maven.cleanroommc.com'
    }
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
    }
    maven {
        // Cleanroom 的 CurseForge 镜像；只负责 curse.maven 组，避免对其他工件做无谓探测
        name = 'CleanroomCurseMaven'
        url = 'https://curse.cleanroommc.com'
        content {
            includeGroup 'curse.maven'
        }
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
    }
    maven {
        name = "ModMaven"
        url  = uri("https://modmaven.dev/")
    }
    maven {
        name = 'JitPack'
        url = 'https://www.jitpack.io'
    }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com/'
    }
    mavenCentral()
    mavenLocal()
}
dependencies {
    compileOnly "com.cleanroommc:sponge-mixin:0.20.13+mixin.0.8.7"
    if (enable_lwjglx.toBoolean()) {
        compileOnly "com.cleanroommc:lwjglx:1.0.0"
    }

    var mod_version = "v1.1.0"
    compileOnly "com.github.FormlessDragon:Applied-Energistics-2-Supergiant:${mod_version}:dev"
    // AEBaseGui 实现了 MouseTweaks 的 IMTModGuiContainer2（@Optional），编译期需要该类文件
    compileOnly "curse.maven:mouse-tweaks-unofficial-461660:5876158"
    modCompileOnly 'mezz:jei:4.35.1'
    modRuntimeOnly 'mezz:jei:4.35.1'

    // CraftTweaker2 (optional integration — annotated Zen classes are only loaded when CrT is present)
    var crt_version = "4.1.20.716"
    // CraftTweaker artifacts drag in asm-debug-all 5.2 / gson 2.7 as transitive deps; these shadow
    // Cleanroom's newer ASM/gson on the classpath and crash the launch (ASM 5.2 cannot read modern
    // class files). Exclude them from every configuration they may leak into.
    ["compileOnly", "runtimeOnly", "modCompileOnly", "modRuntimeOnly"].each { String conf ->
        configurations.named(conf) {
            exclude group: 'org.ow2.asm', module: 'asm-debug-all'
            exclude group: 'com.google.code.gson', module: 'gson'
        }
    }
    compileOnly "CraftTweaker2:CraftTweaker2-API:${crt_version}"
    compileOnly "CraftTweaker2:ZenScript:${crt_version}"
    // MC1120-Main is the actual mod jar (needs remapping); it does NOT contain the API/ZenScript classes,
    // so those must also be present at runtime in the dev environment.
    modCompileOnly "CraftTweaker2:CraftTweaker2-MC1120-Main:1.12-${crt_version}"
    modRuntimeOnly "CraftTweaker2:CraftTweaker2-MC1120-Main:1.12-${crt_version}"
    runtimeOnly "CraftTweaker2:CraftTweaker2-API:${crt_version}"
    runtimeOnly "CraftTweaker2:ZenScript:${crt_version}"
}
