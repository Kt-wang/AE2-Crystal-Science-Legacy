
repositories {
    // 阿里云镜像优先（public 代理 Maven Central，google 代理 Google Maven），加速依赖解析
    maven { url 'https://maven.aliyun.com/repository/public' }
    maven { url 'https://maven.aliyun.com/repository/google' }
    maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }

    maven {
        name = 'CleanroomMC'
        url = 'https://maven.cleanroommc.com'
    }
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
    }
    maven {
        // Cleanroom 的 CurseForge 镜像；只负责 curse.maven 组，避免对其他工件做无谓探测
        name = 'CleanroomCurseMaven'
        url = 'https://curse.cleanroommc.com'
        content {
            includeGroup 'curse.maven'
        }
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
    }
    maven {
        name = "ModMaven"
        url  = uri("https://modmaven.dev/")
    }
    maven {
        name = 'JitPack'
        url = 'https://www.jitpack.io'
    }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com/'
    }
    mavenCentral()
    mavenLocal()
}
dependencies {
    // Match formal Cleanroom 0.4.0's Mixin annotations.
    compileOnly("com.cleanroommc:sponge-mixin:0.20.12+mixin.0.8.7") { transitive = false }
    if (enable_lwjglx.toBoolean()) {
        // Compile against the public LWJGL 2 API. Cleanroom redirects these
        // references to the active input backend at runtime. Calling org.lwjglx
        // directly bypasses that compatibility layer (and can invoke absent GLFW
        // functions on SDL runtimes). Never bundle either input implementation.
        compileOnly("org.lwjgl.lwjgl:lwjgl:2.9.4-nightly-20150209") { transitive = false }
    }

    var mod_version = "v1.1.0"
    if (project.hasProperty('ae2sDevJar')) {
        compileOnly files(project.property('ae2sDevJar'))
    } else {
        compileOnly "com.github.FormlessDragon:Applied-Energistics-2-Supergiant:${mod_version}:dev"
    }
    // AEBaseGui 实现了 MouseTweaks 的 IMTModGuiContainer2（@Optional），编译期需要该类文件
    compileOnly "curse.maven:mouse-tweaks-unofficial-461660:5876158"
    modCompileOnly 'mezz:jei:4.35.1'
    modRuntimeOnly 'mezz:jei:4.35.1'

    // CraftTweaker2 (optional integration — annotated Zen classes are only loaded when CrT is present)
    var crt_version = "4.1.20.716"
    // CraftTweaker artifacts drag in asm-debug-all 5.2 / gson 2.7 as transitive deps; these shadow
    // Cleanroom's newer ASM/gson on the classpath and crash the launch (ASM 5.2 cannot read modern
    // class files). Exclude them from every configuration they may leak into.
    ["compileOnly", "runtimeOnly", "modCompileOnly", "modRuntimeOnly"].each { String conf ->
        configurations.named(conf) {
            exclude group: 'org.ow2.asm', module: 'asm-debug-all'
            exclude group: 'com.google.code.gson', module: 'gson'
        }
    }
    compileOnly("CraftTweaker2:CraftTweaker2-API:${crt_version}") { transitive = false }
    compileOnly("CraftTweaker2:ZenScript:${crt_version}") { transitive = false }
    // MC1120-Main is the actual mod jar (needs remapping); it does NOT contain the API/ZenScript classes,
    // so those must also be present at runtime in the dev environment.
    // Unimined remaps these through detached configurations, which do not retain
    // the exclusions above. All three required artifacts are already explicit.
    modCompileOnly("CraftTweaker2:CraftTweaker2-MC1120-Main:1.12-${crt_version}") { transitive = false }
    modRuntimeOnly("CraftTweaker2:CraftTweaker2-MC1120-Main:1.12-${crt_version}") { transitive = true }
    runtimeOnly("CraftTweaker2:CraftTweaker2-API:${crt_version}") { transitive = false }
    runtimeOnly("CraftTweaker2:ZenScript:${crt_version}") { transitive = false }
}
