plugins {
    id 'java'
    id 'java-library'
    id 'maven-publish'
    id 'com.gradleup.shadow' version '9.4.1'
    id 'org.jetbrains.gradle.plugin.idea-ext' version '1.4.1'
    id 'xyz.wagyourtail.unimined' version '1.4.25-kappa'
}

import org.jetbrains.gradle.ext.Gradle

ext {
    //noinspection GroovyAssignabilityCheck
    access_transformer_locations = "${mod_id}_at.cfg"
}

version = mod_version
group = root_package

base {
    // Keep the internal mod id unchanged; only use the Gradle project name for artifacts.
    archivesName = rootProject.name
}

// Version every artifact so releases are distinguishable:
// ProjectName-1.0.0.jar, ProjectName-1.0.0-dev.jar, ProjectName-1.0.0-sources.jar
tasks.withType(AbstractArchiveTask).configureEach {
    archiveVersion = version
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    if (generate_sources_jar.toBoolean()) {
        withSourcesJar()
    }
    if (generate_javadocs_jar.toBoolean()) {
        withJavadocJar()
    }
}

configurations {
    contain
    implementation.extendsFrom(contain)
    modCompileOnly
    compileOnly.extendsFrom(modCompileOnly)
    modRuntimeOnly
    runtimeOnly.extendsFrom(modRuntimeOnly)
}

def remapTaskName = enable_shadow.toBoolean() ? "remapShadowJar" : "remapJar"

//noinspection GroovyAssignabilityCheck
unimined.minecraft {
    version "1.12.2"

    mappings {
        mcp("stable", "39-1.12")
    }

    cleanroom {
        if (use_access_transformer.toBoolean()) {
            accessTransformer "${rootProject.projectDir}/src/main/resources/$access_transformer_locations"
        }
        loader "0.5.14-alpha"
        runs.all {
            args += ['--username', minecraft_username]
            // Keep raw (un-remapped) CraftTweaker jars off the JVM classpath: Foundation's class
            // loading is parent-first, so CrT classes on the system classpath would be loaded by
            // the AppClassLoader while ae2csl classes live in the LaunchClassLoader — splitting
            // classes and making Zen scripts fail with NoClassDefFoundError. The remapped copies
            // under modTransform are still discovered by FML as mods.
            classpath = classpath.filter { f ->
                def n = f.name
                !n.startsWith("CraftTweaker2-") && !n.startsWith("ZenScript-")
            }
            def extraArgs = extra_jvm_args
            if (extraArgs != null && !extraArgs.trim().isEmpty()) {
                jvmArgs += extraArgs.trim().split("\\s+").toList()
            }
            if (enable_foundation_debug.toBoolean()) {
                systemProperty("foundation.dump", "true")
                systemProperty("foundation.verbose", "true")
            }
            if (is_coremod.toBoolean()) {
                systemProperty("fml.coreMods.load", coremod_plugin_class_name)
            }
            return
        }
    }

    defaultRemapJar = false

    String jarTaskName = enable_shadow.toBoolean() ? "shadowJar" : "jar"

    remap(tasks.named(jarTaskName).get())

    mods {
        remap(configurations.modCompileOnly)
        remap(configurations.modRuntimeOnly)
    }
}

dependencies {
    if (use_asset_mover.toBoolean()) {
        implementation "com.cleanroommc:assetmover:${asset_mover_version}"
    }
    if (enable_junit_testing.toBoolean()) {
        testImplementation 'org.junit.jupiter:junit-jupiter:6.0.3'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }
}

apply from: 'gradle/scripts/dependencies.gradle'

processResources {
    rename '(.+_at.cfg)', 'META-INF/$1'
}

// Generate Tags.java so @Mod(version = ...) always matches gradle.properties mod_version.
def generatedVersionDir = layout.buildDirectory.dir('generated/sources/version/java')
tasks.register('generateVersionSource') {
    def outDir = generatedVersionDir
    def ver = mod_version
    inputs.property('modVersion', ver)
    outputs.dir(outDir)
    doLast {
        def file = outDir.get().file('ae2csl/Tags.java').asFile
        file.parentFile.mkdirs()
        file.text = """/*
 * AE2 Crystal Science
 * A mod that adds crystal-related machines and items to Applied Energistics 2
 */

package ae2csl;

public final class Tags {

    public static final String MOD_ID = "ae2csl";
    public static final String MOD_NAME = "AE2 Crystal Science: Legacy";
    public static final String VERSION = "${ver}";

    private Tags() {
    }
}
"""
    }
}

sourceSets {
    main {
        java.srcDir(generatedVersionDir)
    }
}

tasks.named('compileJava').configure { dependsOn 'generateVersionSource' }
tasks.matching { it.name == 'sourcesJar' || it.name == 'javadoc' }.configureEach {
    dependsOn 'generateVersionSource'
}

idea {
    module {
        inheritOutputDirs = true
    }
    project {
        settings {
            runConfigurations {
                '1. Build'(Gradle) {
                    taskNames = ["build"]
                }
                '2. Run Client'(Gradle) {
                    taskNames = ["runClient"]
                }
                '3. Run Server'(Gradle) {
                    taskNames = ["runServer"]
                }
            }
            compiler.javac {
                afterEvaluate {
                    javacAdditionalOptions = '-encoding utf8'
                    moduleJavacAdditionalOptions = [
                            (project.name + '.main'): tasks.compileJava.options.compilerArgs.collect { "\"${it}\"" }.join(' ')
                    ]
                }
            }
        }
    }
}

if (!enable_shadow.toBoolean()) {
    shadowJar.enabled = false
}

compileJava {
    sourceCompatibility = targetCompatibility = JavaVersion.VERSION_25
}

jar {
    archiveClassifier = 'dev'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from('LICENSE') {
        into 'META-INF'
        rename { 'LICENSE-AE2CSL' }
    }
    from('NOTICE') {
        into 'META-INF'
        rename { 'NOTICE-AE2CSL' }
    }
    from('LICENSES') {
        into 'META-INF/LICENSES'
    }
    if (configurations.contain.size() > 0) {
        into('/') {
            from configurations.contain
        }
    }
    doFirst {
        manifest {
            def attribute_map = [:]
            attribute_map['ModType'] = "CRL"
            if (configurations.contain.size() > 0) {
                attribute_map['ContainedDeps'] = configurations.contain.collect { it.name }.join(' ')
                attribute_map['NonModDeps'] = true
            }
            if (is_coremod.toBoolean()) {
                attribute_map['FMLCorePlugin'] = coremod_plugin_class_name
                if (coremod_includes_mod.toBoolean()) {
                    attribute_map['FMLCorePluginContainsFMLMod'] = true
                }
            }
            if (use_access_transformer.toBoolean()) {
                attribute_map['FMLAT'] = access_transformer_locations
            }
            attributes(attribute_map)
        }
    }
    finalizedBy(tasks.named(remapTaskName).get())
}


shadowJar {
    //noinspection GroovyAssignabilityCheck,GroovyAccessibility
    configurations = [project.configurations.shadow]
    archiveClassifier = "shadow"
}


tasks.named(remapTaskName).configure {
    doFirst {
        logging.captureStandardOutput LogLevel.INFO
    }
    doLast {
        logging.captureStandardOutput LogLevel.QUIET
    }
}

compileTestJava {
    sourceCompatibility = targetCompatibility = JavaVersion.VERSION_25
}

test {
    useJUnitPlatform()
    javaLauncher.set(javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(25)
    })
    if (show_testing_output.toBoolean()) {
        testLogging {
            showStandardStreams = true
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Direct runtime-backend references can compile and start, but fail on input
// when another Cleanroom backend is active. Check the actual installation jar.
tasks.register('verifyPublicInputApi') {
    dependsOn tasks.named(remapTaskName)
    def installationJar = tasks.named(remapTaskName).flatMap { it.archiveFile }
    inputs.file installationJar
    doLast {
        zipTree(installationJar.get().asFile).matching { include '**/*.class' }.each { entry ->
            def constants = new String(entry.bytes, java.nio.charset.StandardCharsets.ISO_8859_1)
            if (constants.contains('org/lwjglx/') || constants.contains('org/lwjgl/glfw/')) {
                throw new GradleException("Direct input backend reference in ${entry.name}; use public LWJGL 2 / Forge input APIs")
            }
        }
    }
}
tasks.named('check') { dependsOn 'verifyPublicInputApi' }

apply from: 'gradle/scripts/publishing.gradle'
apply from: 'gradle/scripts/extra.gradle'
